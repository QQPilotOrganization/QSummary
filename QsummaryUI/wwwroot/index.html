<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSummary - 聊天记录总结</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="container" id="app">
        <header>
            <h1>QSummary - 聊天记录总结 <small style="font-size:14px;color:#888;">Map-Reduce + RAG 版</small></h1>
            <div class="top-bar">
                <button class="btn-secondary" onclick="showHome()">🏠 主页</button>
                <button class="btn-secondary" onclick="showSettings()">⚙️ 设置</button>
            </div>
        </header>
        <div id="content">
            <!-- 内容将通过 JavaScript 动态加载 -->
        </div>
    </div>

    <!-- 1. 原有：全量总结确认模态框 -->
    <div class="modal-overlay" id="confirmModal" style="display: none;">
        <div class="modal">
            <h2>确认总结</h2>
            <p id="confirmMessage" style="white-space:pre-line;">确定要进行总结吗？</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="confirmSummary()">开始总结</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增：Map-Reduce 参数确认模态框 -->
    <div class="modal-overlay" id="mapReduceModal" style="display: none;">
        <div class="modal" style="width: 480px;">
            <h2>🧩 Map-Reduce 总结参数</h2>
            <p>群组：<b id="mrGroupName" style="word-break:break-all;"></b></p>
            <div style="margin:15px 0;">
                <label style="display:block;font-weight:bold;margin-bottom:5px;">
                    每个小块的消息数量（权重）：
                </label>
                <input type="number" id="mrChunkSize" min="5" max="500" value="60" style="width:100%;padding:8px;">
                <small style="color:#888;display:block;margin-top:5px;">
                    • 数值大 = 块少、每块信息多，适合较短记录<br>
                    • 数值小 = 块多、切分细，适合超长记录<br>
                    • 推荐 40~100 之间；聊天记录超过 500 条建议降到 20~40
                </small>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="confirmMapReduce()">🧩 开始 Map-Reduce 总结</button>
            </div>
        </div>
    </div>

    <!-- 3. 删除确认模态框 -->
    <div class="modal-overlay" id="deleteConfirmModal" style="display: none;">
        <div class="modal">
            <h2 style="color: var(--danger-color);">确认删除</h2>
            <p style="color: var(--text-color);">确定要删除所有聊天记录吗？此操作不可恢复！</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeDeleteConfirm()">取消</button>
                <button class="btn-danger" onclick="clearDatabase()">确认删除</button>
            </div>
        </div>
    </div>

    <script src="main.js">

    </script>
</body>

</html>
